services:
  # VYORA Backend Web Service
  - type: web
    name: vyora-backend
    env: python
    region: oregon # or frankfurt, ohio, singapore
    plan: standard
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4"
    healthCheckPath: /api/v1/audit/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard: Supabase Transaction Pooler URL (port 6543)
      - key: SECRET_KEY
        generateValue: true # Render generates a secure 256-bit random string
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: ALLOWED_ORIGINS
        sync: false # Set in Render Dashboard to your Vercel URL, e.g. https://vyora.vercel.app
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard: Google Gemini API Key
